type AssetOwner {
  assetId: Long!
  owner: User
  group: Group
  ownerType: String!
}

type AssetVersionConnection {
  nodes: [AssetVersion!]!
  pageInfo: PageInfo!
}

type AssetConnection {
  nodes: [Asset!]!
  pageInfo: PageInfo!
  totalCount: Int
}

# ─────────────────────────────────────────────
# Badge domain
# ─────────────────────────────────────────────

type Badge {
  id: ID!
  name: String!
  description: String
  displayName: String
