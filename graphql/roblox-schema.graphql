  name: String!
}

type GamePass {
  id: ID!
  name: String!
  description: String
  displayName: String
  price: Int
  isOwned: Boolean
  iconImageId: Long
  game: Game
}

type GamePassConnection {
  nodes: [GamePass!]!
  pageInfo: PageInfo!
  totalCount: Int
}

type CatalogProduct {
  id: Long!
  type: String!
  isPublicDomain: Boolean!
  isForSale: Boolean!
  priceInRobux: Int
  premiumPricing: PremiumPricing
}

type PremiumPricing {
  premiumDiscountPercentage: Int!
  premiumPriceInRobux: Int!
}

# ─────────────────────────────────────────────
# Economy / Currency / Premium domain
# ─────────────────────────────────────────────

type Premium {
  userId: ID!
  isPremium: Boolean!
  subscription: PremiumSubscription
}

type PremiumSubscription {
  subscriptionProductModel: PremiumProduct
  status: SubscriptionStatus!
  nextRenewalDate: DateTime
  expiredDate: DateTime
}

type PremiumProduct {
  premiumFeatureId: Int!
  name: String!
  robuxStipendAmount: Int!
  isLifetime: Boolean!
}

type Currency {
  robux: Int!
}

type Robux {
  amount: Int!
  userId: ID
}

type Subscription {
  id: ID!
  userId: ID!
  productId: ID!
  status: SubscriptionStatus!
  startedAt: DateTime!
  renewsAt: DateTime
  cancelledAt: DateTime
  expiresAt: DateTime
}

type Transaction {
  id: Long!
  created: DateTime!
  isPending: Boolean!
  agent: TransactionAgent
  details: TransactionDetails
  currency: Currency!
  transactionType: TransactionType!
}

type TransactionAgent {
  id: Long!
  type: String!
  name: String
}

type TransactionDetails {
  id: Long!
  name: String
  type: String
}

type DeveloperExchange {
  id: Long!
  userId: Long!
  amount: Int!
  robuxAmount: Long!
  status: String!
  created: DateTime!
  currency: String!
}

type TransactionConnection {
  nodes: [Transaction!]!
  pageInfo: PageInfo!
  totalCount: Int
}

