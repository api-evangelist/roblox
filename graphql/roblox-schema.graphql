# ─────────────────────────────────────────────
# Inputs
# ─────────────────────────────────────────────

input UserFilterInput {
  ids: [ID!]
  names: [String!]
  hasVerifiedBadge: Boolean
}

input GroupFilterInput {
  userId: ID
  nameKeyword: String
}

input GameFilterInput {
  creatorId: ID
  creatorType: String
  genre: String
  sortOrder: String
}

input AssetFilterInput {
  creatorId: ID
  creatorType: String
  assetType: AssetType
  isForSale: Boolean
}

input TradeFilterInput {
  userId: ID
  status: TradeStatus
}

input DataStoreEntryInput {
  key: String!
  value: JSON!
  userIds: [Long!]
  attributes: JSON
}

input OrderedDataStoreEntryInput {
  key: String!
  value: Long!
}

input PublishMessageInput {
  topic: String!
  message: String!
}

input AvatarUpdateInput {
  bodyType: AvatarType
  scales: AvatarScaleInput
  bodyColors: AvatarBodyColorsInput
  assetIds: [Long!]
}

input AvatarScaleInput {
  height: Float
  width: Float
  head: Float
  depth: Float
  proportion: Float
  bodyType: Float
}

input AvatarBodyColorsInput {
  headColorId: Int
  torsoColorId: Int
  rightArmColorId: Int
  leftArmColorId: Int
  rightLegColorId: Int
  leftLegColorId: Int
}

input OutfitCreateInput {
  name: String!
  bodyColors: AvatarBodyColorsInput!
  assetIds: [Long!]!
  scale: AvatarScaleInput!
  playerAvatarType: AvatarType!
}

input PlacePublishInput {
  universeId: Long!
  placeId: Long!
  versionType: String!
  file: Upload!
}

# ─────────────────────────────────────────────
# Root types
# ─────────────────────────────────────────────

type Query {
  # User queries
  user(id: ID!): User
  userByName(username: String!): User
  users(filter: UserFilterInput, limit: Int, cursor: String): UserConnection
  userPresence(userIds: [ID!]!): [UserPresence!]
  followingStatus(userId: ID!, targetUserId: ID!): FollowingStatus

  # Friend queries
  friends(userId: ID!, limit: Int, cursor: String): FriendConnection
  friendRequests(userId: ID!, limit: Int, cursor: String): FriendRequestConnection

  # Group queries
  group(id: ID!): Group
  groups(filter: GroupFilterInput, limit: Int, cursor: String): GroupConnection
  groupsByUser(userId: ID!, limit: Int, cursor: String): GroupMemberConnection

  # Game / Universe queries
  game(id: ID!): Game
  games(filter: GameFilterInput, limit: Int, cursor: String): GameConnection
  popularGames(genre: String, limit: Int, cursor: String): GameConnection
  gameServers(universeId: ID!, serverType: ServerType, limit: Int, cursor: String): ServerConnection

  # Asset queries
  asset(id: ID!): Asset
  assets(filter: AssetFilterInput, limit: Int, cursor: String): AssetConnection
  assetVersions(assetId: ID!, limit: Int, cursor: String): AssetVersionConnection

  # Badge queries
  badge(id: ID!): Badge
  badgesByGame(universeId: ID!, limit: Int, cursor: String): BadgeConnection
  badgesAwardedToUser(userId: ID!, limit: Int, cursor: String): BadgeAwardedConnection

  # Bundle & GamePass queries
  bundle(id: ID!): Bundle
  gamePass(id: ID!): GamePass
  gamePassesByGame(universeId: ID!, limit: Int, cursor: String): GamePassConnection

  # Avatar queries
  avatar(userId: ID!): Avatar
  avatarMetadata: JSON
  userOutfits(userId: ID!, limit: Int, cursor: String): UserOutfitConnection

  # Inventory queries
  inventory(userId: ID!, assetType: AssetType, limit: Int, cursor: String): InventoryItemConnection

  # Trade queries
  trade(id: Long!): Trade
  trades(filter: TradeFilterInput, limit: Int, cursor: String): TradeConnection

  # Economy queries
  robuxBalance(userId: ID!): Robux
  transactions(userId: ID!, transactionType: TransactionType, limit: Int, cursor: String): TransactionConnection
  premium(userId: ID!): Premium

  # DataStore queries
  dataStore(universeId: ID!, name: String!, scope: String): DataStore
  dataStores(universeId: ID!, prefix: String, limit: Int, cursor: String): [DataStore!]
  dataStoreEntry(universeId: ID!, datastoreName: String!, entryKey: String!, scope: String): DataStoreEntry
  orderedDataStore(universeId: ID!, name: String!, scope: String): OrderedDataStore

  # Message queries
  messages(userId: ID!, limit: Int, cursor: String): MessageConnection

  # Analytics queries
  universeStats(universeId: ID!): UniverseStats

  # Thumbnail queries
  userThumbnail(userId: ID!, size: String, format: String): Thumbnail
  assetThumbnail(assetId: ID!, size: String, format: String): Thumbnail
  gameThumbnail(universeId: ID!, size: String, format: String): Thumbnail

  # Instance queries
  instance(universeId: ID!, placeId: Long!, instanceId: ID!): Instance
}

type Mutation {
  # Friend mutations
  sendFriendRequest(userId: ID!): FriendRequest
  acceptFriendRequest(userId: ID!): Friend
  declineFriendRequest(userId: ID!): Boolean
  unfriend(userId: ID!): Boolean
  followUser(userId: ID!): Boolean
  unfollowUser(userId: ID!): Boolean

  # Group mutations
  joinGroup(groupId: ID!): GroupMember
  leaveGroup(groupId: ID!): Boolean
  requestGroupMembership(groupId: ID!): GroupMembershipRequest
  approveGroupMembership(groupId: ID!, userId: ID!): GroupMember
  declineGroupMembership(groupId: ID!, userId: ID!): Boolean
  updateGroupMemberRole(groupId: ID!, userId: ID!, roleId: ID!): GroupMember
  removeGroupMember(groupId: ID!, userId: ID!): Boolean
  updateGroupShout(groupId: ID!, message: String!): GroupShout

  # Avatar mutations
  updateAvatar(userId: ID!, input: AvatarUpdateInput!): Avatar
  createOutfit(userId: ID!, input: OutfitCreateInput!): UserOutfit
  updateOutfit(outfitId: Long!, input: OutfitCreateInput!): UserOutfit
  deleteOutfit(outfitId: Long!): Boolean
  wearOutfit(userId: ID!, outfitId: Long!): Avatar

  # DataStore mutations
  setDataStoreEntry(universeId: ID!, datastoreName: String!, entryKey: String!, input: DataStoreEntryInput!): DataStoreEntry
  deleteDataStoreEntry(universeId: ID!, datastoreName: String!, entryKey: String!): Boolean
  updateOrderedDataStoreEntry(universeId: ID!, datastoreName: String!, entryKey: String!, input: OrderedDataStoreEntryInput!): OrderedDataStoreEntry
  deleteOrderedDataStoreEntry(universeId: ID!, datastoreName: String!, entryKey: String!): Boolean

  # Messaging mutations
  publishMessage(universeId: ID!, input: PublishMessageInput!): MessagingServiceMessage
  sendMessage(userId: ID!, subject: String!, body: String!): Message
  markMessageRead(messageId: Long!): Message
  deleteMessage(messageId: Long!): Boolean

  # Place mutations
  publishPlace(input: PlacePublishInput!): PlaceUpdate

  # Trade mutations
  sendTrade(targetUserId: ID!, offer: TradeOfferInput!, request: TradeOfferInput!): Trade
  acceptTrade(tradeId: Long!): TradeStatus
  declineTrade(tradeId: Long!): TradeStatus
  counterTrade(tradeId: Long!, offer: TradeOfferInput!, request: TradeOfferInput!): Trade
}

input TradeOfferInput {
  userId: Long!
  userAssetIds: [Long!]!
  robux: Int!
}

type Subscription {
  # Real-time game presence updates
  userPresenceUpdated(userId: ID!): UserPresence
  # Real-time messaging
  messageReceived(userId: ID!): Message
  # Analytics event stream
  analyticsEvent(universeId: ID!): AnalyticsEvent
  # Trade status changes
  tradeStatusUpdated(userId: ID!): Trade
}
