}

type BadgeConnection {
  nodes: [Badge!]!
  pageInfo: PageInfo!
  totalCount: Int
}

type BadgeAwardedConnection {
  nodes: [BadgeAwarded!]!
  pageInfo: PageInfo!
  totalCount: Int
}

# ─────────────────────────────────────────────
# Bundle & GamePass domain
# ─────────────────────────────────────────────

type Bundle {
  id: ID!
  name: String!
  description: String
  bundleType: String!
