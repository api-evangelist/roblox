"""
Roblox GraphQL Schema
Conceptual schema covering Roblox Open Cloud API, Engine API, and platform surfaces:
Users, Groups, Games/Universes, Assets, Avatar, Economy, DataStores, Social, Inventory, Analytics.
"""

scalar DateTime
scalar Long
scalar JSON
scalar Upload

# ─────────────────────────────────────────────
# Enums
# ─────────────────────────────────────────────

enum UserStatus {
  ONLINE
  IN_GAME
  IN_STUDIO
  OFFLINE
}

enum FriendRequestStatus {
  PENDING
  ACCEPTED
  DECLINED
  EXPIRED
}

enum TradeStatus {
  OPEN
  PENDING
  COMPLETED
  DECLINED
  INACTIVE
  COUNTERED
  EXPIRED
  UNKNOWN
}

enum AssetType {
  IMAGE
  AUDIO
  MESH
  LUA
  HTML
  TEXT
  HAT
  PLACE
  MODEL
  SHIRT
  PANTS
  DECAL
  AVATAR
  HEAD
  FACE
  GEAR
  BADGE
  GAME_PASS
  ANIMATION
  ARMS
  LEGS
  TORSO
  RIGHT_ARM
  LEFT_ARM
  RIGHT_LEG
  LEFT_LEG
  PACKAGE
  YOUTUBE_VIDEO
  GAME_CARD
  T_SHIRT
  PLUGIN
  MESH_PART
  HAIR_ACCESSORY
  FACE_ACCESSORY
  NECK_ACCESSORY
  SHOULDER_ACCESSORY
  FRONT_ACCESSORY
  BACK_ACCESSORY
  WAIST_ACCESSORY
  CLIMB_ANIMATION
  DEATH_ANIMATION
  FALL_ANIMATION
  IDLE_ANIMATION
  JUMP_ANIMATION
  RUN_ANIMATION
  SWIM_ANIMATION
  WALK_ANIMATION
  POSE_ANIMATION
  EMOTE_ANIMATION
  VIDEO
  TEXTURE_PACK
}

enum GroupMemberRole {
  GUEST
  MEMBER
  OFFICER
  ADMIN
  OWNER
}

enum GroupJoinPolicy {
  OPEN
  REQUEST_TO_JOIN
  CLOSED
}

enum AvatarType {
  R6
  R15
}

enum TransactionType {
  PURCHASE
  SALE
  TRADE
  DEV_EXCHANGE
  SUBSCRIPTION
  AFFILIATE
  PREMIUM
  BADGE
  GAME_PASS
  REFUND
}

enum SubscriptionStatus {
  ACTIVE
  CANCELLED
  EXPIRED
  PAYMENT_FAILED
}

enum ThumbnailState {
  COMPLETED
  PENDING
  ERROR
  BLOCKED
}

enum ModerationState {
  APPROVED
  PENDING
  REJECTED
  DELETED
}

enum ServerType {
  PUBLIC
  PRIVATE
  RESERVED
}

enum PlaceAccessType {
  PUBLIC
  FRIENDS
  PRIVATE
}

# ─────────────────────────────────────────────
# User domain
# ─────────────────────────────────────────────

type User {
  id: ID!
  name: String!
  displayName: String!
  description: String
  created: DateTime!
  isBanned: Boolean!
  hasVerifiedBadge: Boolean!
  profile: UserProfile
  presence: UserPresence
  friends(limit: Int, cursor: String): FriendConnection
  groups(limit: Int, cursor: String): GroupMemberConnection
  inventory(limit: Int, cursor: String, assetType: AssetType): InventoryItemConnection
  avatar: UserAvatar
  badges(limit: Int, cursor: String): BadgeAwardedConnection
  gamePasses(limit: Int, cursor: String): GamePassConnection
  thumbnail(size: String, format: String): Thumbnail
  outfits(limit: Int, cursor: String): UserOutfitConnection
  premium: Premium
}

type UserProfile {
  userId: ID!
  blurb: String
  created: DateTime!
  isBanned: Boolean!
  hasVerifiedBadge: Boolean!
  socialLinks: [SocialLink!]
}

type UserPresence {
  userId: ID!
  userPresenceType: UserStatus!
  lastLocation: String
  placeId: Long
  rootPlaceId: Long
  universeId: Long
  lastOnline: DateTime
  gameId: String
}

type SocialLink {
  id: ID!
  type: String!
  url: String!
  title: String!
}

type UserConnection {
  nodes: [User!]!
  pageInfo: PageInfo!
  totalCount: Int
}

# ─────────────────────────────────────────────
# Friend / Social domain
# ─────────────────────────────────────────────

type Friend {
  id: ID!
  name: String!
  displayName: String!
  hasVerifiedBadge: Boolean!
  friendFrequentScore: Int
  isOnline: Boolean
  presence: UserPresence
}

type FriendRequest {
  id: ID!
  senderId: ID!
  sender: User
  receiverId: ID!
  receiver: User
  created: DateTime!
  status: FriendRequestStatus!
}

type FollowingStatus {
  isFollowing: Boolean!
  isFollowedBy: Boolean!
  areFriends: Boolean!
}

type FriendConnection {
  nodes: [Friend!]!
  pageInfo: PageInfo!
  totalCount: Int
}

type FriendRequestConnection {
  nodes: [FriendRequest!]!
  pageInfo: PageInfo!
  totalCount: Int
}

# ─────────────────────────────────────────────
# Group domain
# ─────────────────────────────────────────────

type Group {
  id: ID!
  name: String!
  description: String
  memberCount: Int!
  created: DateTime!
  publicEntryAllowed: Boolean!
  joinPolicy: GroupJoinPolicy!
  hasVerifiedBadge: Boolean!
  owner: Creator
  shout: GroupShout
  roles(limit: Int): [GroupRole!]
  members(limit: Int, cursor: String): GroupMemberConnection
  membershipRequests(limit: Int, cursor: String): GroupMembershipRequestConnection
  payoutRecipients: [GroupPayoutRecipient!]
  thumbnail: Thumbnail
  games(limit: Int, cursor: String): GameConnection
}

type GroupRole {
  id: ID!
  name: String!
  rank: Int!
  memberCount: Int
  permissions: GroupRolePermissions
}

type GroupRolePermissions {
  groupPostsPermissions: GroupPostsPermissions
  groupMembershipPermissions: GroupMembershipPermissions
  groupManagementPermissions: GroupManagementPermissions
  groupEconomyPermissions: GroupEconomyPermissions
}

type GroupPostsPermissions {
  viewWall: Boolean!
  postToWall: Boolean!
  deleteFromWall: Boolean!
  viewStatus: Boolean!
  postToStatus: Boolean!
}

type GroupMembershipPermissions {
  changeRank: Boolean!
  inviteMembers: Boolean!
  removeMembers: Boolean!
}

type GroupManagementPermissions {
  manageRelationships: Boolean!
  manageClan: Boolean!
  viewAuditLog: Boolean!
}

type GroupEconomyPermissions {
  spendGroupFunds: Boolean!
  advertiseGroup: Boolean!
  createItems: Boolean!
  manageItems: Boolean!
  addGroupPlaces: Boolean!
  manageGroupGames: Boolean!
  viewGroupPayouts: Boolean!
  viewAnalytics: Boolean!
}

type GroupMember {
  user: User!
  role: GroupRole!
  joinedAt: DateTime
}

type GroupMembershipRequest {
  userId: ID!
  user: User
  created: DateTime!
}

type GroupPayoutRecipient {
  user: User!
  percentage: Int!
}

type GroupShout {
  body: String!
  poster: User
  created: DateTime!
  updated: DateTime!
}

type GroupMemberConnection {
  nodes: [GroupMember!]!
  pageInfo: PageInfo!
  totalCount: Int
}

type GroupMembershipRequestConnection {
  nodes: [GroupMembershipRequest!]!
  pageInfo: PageInfo!
  totalCount: Int
}

type GroupConnection {
  nodes: [Group!]!
  pageInfo: PageInfo!
  totalCount: Int
}

# ─────────────────────────────────────────────
# Game / Universe / Place domain
# ─────────────────────────────────────────────

type Game {
  id: ID!
  rootPlaceId: Long!
  name: String!
  description: String
  created: DateTime!
  updated: DateTime!
  maxPlayers: Int!
  allowedGearTypes: [String!]
  genre: String
  isAllGenre: Boolean!
  isFavoritedByUser: Boolean
  favoritedCount: Long
  playing: Int
  visits: Long
  creator: Creator!
  media: [GameMedia!]
  badges(limit: Int, cursor: String): BadgeConnection
  gamePasses(limit: Int, cursor: String): GamePassConnection
  servers(serverType: ServerType, limit: Int, cursor: String): ServerConnection
  permissions: GamePermission
  settings: GameSettings
  thumbnail: Thumbnail
  stats: UniverseStats
}

type GameMedia {
  id: ID!
  mediaType: String!
  imageId: Long
  videoHash: String
  videoTitle: String
  approved: Boolean!
}

type GameSettings {
  universeId: ID!
  allowPrivateServers: Boolean!
  privateServerPrice: Int
  optInRegions: [String!]
  optOutRegions: [String!]
  isMeshTextureApiAccessAllowed: Boolean
}

type GamePermission {
  isThirdPartyTeleportAllowed: Boolean!
  isThirdPartyAssetAllowed: Boolean!
  isThirdPartyPurchaseAllowed: Boolean!
}

type GameBadge {
  id: ID!
  name: String!
  description: String
  displayName: String
  displayDescription: String
  enabled: Boolean!
  iconImageId: Long!
  displayIconImageId: Long
  created: DateTime!
  updated: DateTime!
  statistics: BadgeStatistics
}

type Server {
  id: ID!
  maxPlayers: Int!
  playing: Int!
  playerTokens: [String!]
  fps: Float
  ping: Int
  name: String
  vipServerId: Long
  vipServerOwnerId: Long
  accessCode: String
}

type PlaceUpdate {
  placeId: Long!
  universeId: Long!
  versionNumber: Int
  publishType: String
  created: DateTime
}

type GameConnection {
  nodes: [Game!]!
  pageInfo: PageInfo!
  totalCount: Int
}

type ServerConnection {
  nodes: [Server!]!
  pageInfo: PageInfo!
  totalCount: Int
}

# ─────────────────────────────────────────────
# DataStore domain
# ─────────────────────────────────────────────

type DataStore {
  name: String!
  createdTime: DateTime
  entries(limit: Int, cursor: String, prefix: String): DataStoreEntryConnection
}

type DataStoreEntry {
  key: String!
  value: JSON
  version: String
  created: DateTime
  updated: DateTime
  userIds: [Long!]
  attributes: JSON
  checksum: String
}

type OrderedDataStore {
  name: String!
  scope: String
  entries(limit: Int, cursor: String, ascending: Boolean): OrderedDataStoreEntryConnection
}

type OrderedDataStoreEntry {
  key: String!
  value: Long!
}

type DataStoreEntryConnection {
  nodes: [DataStoreEntry!]!
  pageInfo: PageInfo!
}

type OrderedDataStoreEntryConnection {
  nodes: [OrderedDataStoreEntry!]!
  pageInfo: PageInfo!
}

# ─────────────────────────────────────────────
# Messaging domain
# ─────────────────────────────────────────────

type Message {
  id: Long!
  sender: User
  recipient: User
  subject: String!
  body: String!
  created: DateTime!
  updated: DateTime
  isRead: Boolean!
  isSystemMessage: Boolean!
}

type MessagingServiceMessage {
  message: String!
  sent: Boolean!
  topic: String!
}

type MessageConnection {
  nodes: [Message!]!
  pageInfo: PageInfo!
  totalCount: Int
}

