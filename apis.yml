aid: roblox
name: Roblox
description: 'Roblox is a user-generated content platform where creators build, publish,
  and monetize immersive 3D experiences using Roblox Studio and the Luau scripting
  language. Roblox exposes three distinct developer surfaces: the in-engine Luau scripting
  API (Roblox Engine API) running inside experiences and Studio plugins, the Roblox
  Studio plugin API for editor tooling, and the Open Cloud API (apis.roblox.com) for
  external programmatic access from servers, build pipelines, and back-office tools.
  The Open Cloud surface covers DataStores, Memory Stores, Messaging Service, Place
  Publishing, Universes, Assets, Inventory, Users, Groups, Notifications, Subscriptions,
  and Luau Execution, authenticated either with API keys scoped per-resource or with
  OAuth 2.0 for third-party apps. Roblox also publishes deep documentation for the
  Engine API at create.roblox.com/docs and the legacy ROBLOX Web APIs that power the
  website (subdomains such as users.roblox.com, groups.roblox.com, inventory.roblox.com),
  which remain undocumented for third parties.'
